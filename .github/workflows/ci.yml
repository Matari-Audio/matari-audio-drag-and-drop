name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions: {}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wayland development files
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked --all-features

      - name: Clippy
        run: cargo clippy --locked --lib --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks -D unsafe_op_in_unsafe_fn

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --locked --no-deps

      - name: Publish dry run
        run: cargo publish --dry-run --locked

  windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Check Windows backend
        run: cargo clippy --locked --lib --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks -D unsafe_op_in_unsafe_fn

  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Check macOS backend
        run: cargo clippy --locked --lib --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks -D unsafe_op_in_unsafe_fn

  msrv:
    name: Rust 1.95 MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wayland development files
        run: sudo apt-get update && sudo apt-get install --yes libwayland-dev

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1

      - name: Check declared MSRV
        run: cargo check --locked --all-features

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.95.0"

  # Single required check for branch rulesets and the merge queue.
  conclusion:
    if: ${{ !cancelled() }}
    needs: [linux, windows, macos, msrv, dependency-policy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
