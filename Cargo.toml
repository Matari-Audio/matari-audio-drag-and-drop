[package]
name = "matari-audio-drag-and-drop"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
description = "Typed cross-platform drag-and-drop for Rust audio plugin GUIs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/DerpcatMusic/matari-audio-drag-and-drop"
documentation = "https://docs.rs/matari-audio-drag-and-drop"
publish = ["crates-io"]
keywords = ["audio", "plugins", "dnd", "wayland", "gui"]
categories = ["gui", "os::linux-apis"]
include = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "Cargo.toml",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SECURITY.md",
    "src/**/*.rs",
]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[dependencies]
percent-encoding = "2.3"
raw-window-handle = "0.6"

[target.'cfg(all(target_family = "unix", not(target_os = "macos")))'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = { version = "0.31", features = ["system"] }
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "=0.62.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSView",
    "NSWindow",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = [
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
]
